<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PLAY BACK / Pickled Brain</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    /* === ЖЕСТКИЙ СБРОС ДЛЯ iOS === */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%; /* Критично для iOS WebView */
      overflow-x: hidden;
      overscroll-behavior-y: none; /* Запрет "пружинивания" */
      -webkit-overflow-scrolling: touch;
    }

    * { 
      box-sizing: border-box; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    :root {
      --bg-dark: #0a0a0f;
      --card-bg: rgba(22, 22, 34, 0.85);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-purple: #b829e3;
      --accent-pink: #ff007f;
      --text-main: #f0f0f5;
      --text-muted: #8a8a9e;
      /* Эта переменная будет обновляться через JS с учетом iPhone safe area и MainButton */
      --tg-bottom-offset: 0px; 
    }

    body { 
      background-color: var(--bg-dark); 
      color: var(--text-main); 
      /* Динамический отступ снизу = зона Telegram + высота нашего плеера + 20px запаса */
      padding-bottom: calc(var(--tg-bottom-offset) + 130px); 
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: 
        radial-gradient(circle at 15% 50%, rgba(184, 41, 227, 0.08), transparent 30%),
        radial-gradient(circle at 85% 30%, rgba(255, 0, 127, 0.08), transparent 30%),
        radial-gradient(circle at 50% 80%, rgba(0, 242, 255, 0.05), transparent 30%);
      z-index: -1;
      animation: bgPulse 12s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes bgPulse { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1.15); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-100%); } to { opacity: 1; transform: translateY(0); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes equalize { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.3); } }

    .navbar {
      display: flex; align-items: center; justify-content: space-between; padding: 12px 16px;
      background: rgba(10, 10, 15, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--card-border);
      position: sticky; top: 0; z-index: 100;
      animation: slideDown 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text-main); font-weight: 800; font-size: 0.95rem; }
    .brand-logo-img { width: 32px; height: 32px; object-fit: contain; filter: drop-shadow(0 0 6px var(--accent-purple)); border-radius: 4px; }

    .btn-podcast {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink)); color: #fff; padding: 6px 12px;
      border-radius: 16px; font-size: 0.75rem; font-weight: 600; text-decoration: none; border: none;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.3); cursor: pointer;
    }

    .profile-banner {
      position: relative; width: 100%; padding: 20px 16px;
      background: linear-gradient(135deg, rgba(10, 10, 15, 0.95) 0%, rgba(21, 5, 42, 0.9) 100%);
      border-bottom: 1px solid var(--card-border);
      display: flex; align-items: center; gap: 16px; max-width: 1100px; margin: 0 auto;
      opacity: 0; animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.2s forwards;
    }

    .profile-avatar {
      width: 64px; height: 64px; border-radius: 50%; overflow: hidden;
      border: 2px solid var(--accent-purple); box-shadow: 0 0 15px rgba(184, 41, 227, 0.3); flex-shrink: 0;
      animation: float 6s ease-in-out infinite;
    }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .profile-info { flex: 1; min-width: 0; }
    .profile-name { font-size: 1.3rem; font-weight: 900; letter-spacing: 1px; margin-bottom: 2px; }
    .profile-tagline { font-size: 0.75rem; color: var(--accent-pink); letter-spacing: 1.5px; font-weight: 600; margin-bottom: 8px; }
    
    .profile-details { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.75rem; color: var(--text-muted); }
    .profile-detail { display: flex; align-items: center; gap: 4px; }
    .profile-detail svg { width: 12px; height: 12px; }

    .stats-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .badge { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); padding: 3px 8px; border-radius: 12px; font-size: 0.7rem; }
    .badge b { color: var(--accent-purple); }

    .container { max-width: 1100px; margin: 0 auto; padding: 16px; }
    
    .controls-bar {
      display: flex; gap: 10px; align-items: center;
      margin-bottom: 14px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 10px;
      opacity: 0; animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.3s forwards;
    }

    .search-input {
      flex: 1; padding: 8px 12px; background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border); border-radius: 8px; color: #fff; font-size: 0.9rem; outline: none;
    }
    .track-count { font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; }

    .genre-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; opacity: 0; animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.4s forwards; }
    .tag-btn {
      background: rgba(20, 20, 32, 0.6); border: 1px solid var(--genre-color, var(--card-border)); 
      color: var(--genre-color, var(--text-muted)); padding: 5px 10px; border-radius: 14px; font-size: 0.75rem; cursor: pointer; transition: all 0.2s ease;
    }
    .tag-btn.active { 
      color: #0a0a0f; font-weight: 700; border-color: var(--genre-color, var(--accent-purple)); 
      box-shadow: 0 0 12px var(--genre-color, var(--accent-purple));
    }

    .tracks-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    
    .track-card {
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 8px;
      display: flex; flex-direction: column; gap: 8px; transition: all 0.3s ease; cursor: pointer;
      opacity: 0; width: 100%; /* Гарантируем, что карточка не вылезет за grid */
    }
    .track-card:active { transform: scale(0.97); }

    .card-cover-wrap {
      position: relative; width: 100%; aspect-ratio: 1; border-radius: 8px; overflow: hidden; flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .card-cover { width: 100%; height: 100%; object-fit: cover; }
    
    .play-btn-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(2px);
      display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease;
    }
    .track-card.is-playing .play-btn-overlay { opacity: 1; }
    .play-circle { 
      width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; 
      transform: scale(0.8); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .track-card.is-playing .play-circle { transform: scale(1); }

    .card-content { flex: 1; min-width: 0; width: 100%; }
    .track-title { 
      font-size: 0.8rem; font-weight: 600; line-height: 1.2; color: var(--text-main);
      word-wrap: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .track-card.is-playing .track-title { color: var(--genre-color, var(--accent-purple)); }
    .track-meta { font-size: 0.65rem; color: var(--text-muted); display: flex; justify-content: space-between; margin-top: 4px; }
    .track-genre { font-weight: 700; }

    /* Inline Player */
    .inline-player-wrapper {
      max-height: 0; overflow: hidden; width: 100%;
      transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
      opacity: 0;
    }
    
    .track-card.is-playing {
      grid-column: 1 / -1;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-color: var(--genre-color, var(--accent-purple));
      background: rgba(184, 41, 227, 0.08);
      box-shadow: 0 0 20px rgba(184, 41, 227, 0.15);
    }
    
    .track-card.is-playing .card-cover-wrap { width: 50px; height: 50px; flex-shrink: 0; border-radius: 6px; }
    
    .track-card.is-playing .inline-player-wrapper {
      max-height: 120px;
      opacity: 1;
      margin-left: auto;
      flex: 1;
      min-width: 0; /* Предотвращает распирание flex-контейнера на iOS */
    }

    .inline-player-title {
      font-size: 0.75rem; font-weight: 700; margin-bottom: 4px; 
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .inline-player-iframe { width: 100%; height: 90px; border: none; border-radius: 6px; background: #000; }

    .playing-badge {
      position: absolute; top: 4px; right: 4px; color: #fff; font-size: 0.55rem; font-weight: 800; padding: 2px 5px;
      border-radius: 4px; display: flex; align-items: center; gap: 3px; z-index: 2; backdrop-filter: blur(4px);
    }
    .equalizer { display: flex; gap: 1px; align-items: flex-end; height: 8px; }
    .equalizer span { width: 2px; background: #fff; border-radius: 1px; animation: equalize 0.8s infinite ease-in-out; }
    .equalizer span:nth-child(1) { animation-delay: 0.1s; height: 60%; }
    .equalizer span:nth-child(2) { animation-delay: 0.3s; height: 100%; }
    .equalizer span:nth-child(3) { animation-delay: 0.5s; height: 40%; }

    /* Fixed Bottom Player */
    .player-fixed-bar {
      position: fixed; 
      left: 0; right: 0; 
      /* Ключевое исправление: прижимаем к безопасной зоне Telegram + 10px */
      bottom: calc(var(--tg-bottom-offset) + 10px); 
      background: rgba(10, 10, 18, 0.98); backdrop-filter: blur(16px);
      border-top: 1px solid var(--card-border); z-index: 1000; padding: 8px 16px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transform: translateY(150%); /* Спрятан по умолчанию */
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 -5px 30px rgba(0,0,0,0.6);
      max-width: 1100px;
      margin: 0 auto;
      border-radius: 16px 16px 0 0;
    }
    .player-fixed-bar.is-active { transform: translateY(0); }
    
    .player-title-display { 
      font-size: 0.8rem; font-weight: 700; color: var(--accent-purple); 
      margin-bottom: 4px; text-align: center; width: 100%; 
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
    }
    .player-iframe-container { 
      width: 100%; max-width: 800px; height: 50px; border-radius: 6px; overflow: hidden; background: #000; 
    }
    iframe#promodjFrame { width: 100%; height: 100%; border: none; }

    @media (min-width: 769px) {
      .tracks-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
      .profile-banner { padding: 30px; }
      .profile-avatar { width: 90px; height: 90px; }
      .profile-name { font-size: 1.8rem; }
      .player-fixed-bar { border-radius: 16px; bottom: calc(var(--tg-bottom-offset) + 20px); margin-bottom: 10px; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="#" class="brand" onclick="openProfile(event)">
      <img src="https://cdn.promodj.com/afs/38e259313be3032b8333b46f2e1dbbe112%3Aresize%3A900x900%3Asame%3Apromodj%3Af30fba" alt="Logo" class="brand-logo-img">
      <span>PLAY BACK</span>
    </a>
    <button class="btn-podcast" onclick="openPodcast()">Podcast</button>
  </nav>

  <header class="profile-banner">
    <div class="profile-avatar">
      <img src="https://cdn.promodj.com/afs/38e259313be3032b8333b46f2e1dbbe112%3Aresize%3A900x900%3Asame%3Apromodj%3Af30fba" alt="PLAY BACK">
    </div>
    <div class="profile-info">
      <h1 class="profile-name">PLAY BACK</h1>
      <div class="profile-tagline">REIMAGINED. REMIXED.</div>
      <div class="profile-details">
        <div class="profile-detail">
          <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
          <span>Moscow</span>
        </div>
        <div class="profile-detail">
          <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          <span>Since 2012</span>
        </div>
      </div>
      <div class="stats-badges">
        <span class="badge">PR: <b>808</b></span>
        <span class="badge">TOP: <b>#19 Prog House</b></span>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="controls-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="Поиск...">
      <span id="trackCount" class="track-count">0</span>
    </div>

    <div class="genre-tags">
      <button class="tag-btn active" onclick="filterGenre('ALL')">Все</button>
      <button class="tag-btn" onclick="filterGenre('Deep House')">Deep</button>
      <button class="tag-btn" onclick="filterGenre('Progressive House')">Prog</button>
      <button class="tag-btn" onclick="filterGenre('Progressive Trance')">Trance</button>
      <button class="tag-btn" onclick="filterGenre('Drum & Bass')">DnB</button>
      <button class="tag-btn" onclick="filterGenre('Nu metal')">Nu Metal</button>
      <button class="tag-btn" onclick="filterGenre('Rock')">Rock</button>
    </div>

    <div id="tracksContainer" class="tracks-grid"></div>
  </main>

  <div class="player-fixed-bar" id="fixedPlayerBar">
    <div id="playerTitle" class="player-title-display">Выберите трек</div>
    <div class="player-iframe-container">
      <iframe id="promodjFrame" src="about:blank" allow="autoplay"></iframe>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); 
    
    // Запрещаем свайп вниз для закрытия приложения (мешает скроллу на iOS)
    if (tg.disableVerticalSwipes) {
      tg.disableVerticalSwipes();
    }

    tg.setHeaderColor('#0a0a0f');
    tg.setBackgroundColor('#0a0a0f');

    // === КЛЮЧЕВОЕ ИСПРАВЛЕНИЕ ДЛЯ IPHONE 15 ===
    // Функция динамического расчета нижнего отступа с учетом Safe Area и MainButton
    function updateLayout() {
      // tg.safeAreaInset.bottom автоматически включает высоту Home Indicator И высоту MainButton, если она показана
      const safeBottom = tg.safeAreaInset.bottom || 0;
      document.documentElement.style.setProperty('--tg-bottom-offset', `${safeBottom}px`);
    }

    // Вызываем при загрузке и при любых изменениях вьюпорта (поворот, показ MainButton)
    updateLayout();
    tg.onEvent('viewportChanged', updateLayout);

    const TRACKS_DATA = [
      { id: "7986198", title: "Relaxium - Aqualandia (Dubstep Cover)", genre: "Dubstep", duration: "3:33" },
      { id: "7985600", title: "Земфира - ПММЛ (dubstep cover)", genre: "Dubstep", duration: "3:08" },
      { id: "7983962", title: "Hypnotic", genre: "Progressive Trance", duration: "4:47" },
      { id: "7976073", title: "Mr. Credo - медляк (Deep House Cover)", genre: "Deep House", duration: "2:14" },
      { id: "7972778", title: "Dam Diri Bam", genre: "Progressive Trance", duration: "5:40" },
      { id: "7959627", title: "CheekyBitt - Karina's Lullaby (DnB Cover)", genre: "Drum & Bass", duration: "3:55" },
      { id: "7953493", title: "Pickled Brains - Press ATO", genre: "Deep House", duration: "4:11" },
      { id: "7950474", title: "Лобода - к черту любовь (Nu Metal)", genre: "Nu metal", duration: "3:45" },
      { id: "7938885", title: "Король и Шут - Лесник (Trance Cover)", genre: "Progressive Trance", duration: "4:15" },
      { id: "7929546", title: "Любэ - Конь (Deep House Cover)", genre: "Deep House", duration: "4:25" },
      { id: "7891699", title: "DJ Smell - Вдвоём (Cover)", genre: "Progressive House", duration: "4:32" },
      { id: "7883203", title: "Scooter - Weekend (Nu Metal)", genre: "Nu metal", duration: "3:43" },
      { id: "7879256", title: "Земляне - Трава у дома (Deep)", genre: "Deep House", duration: "4:40" },
      { id: "7865020", title: "Айдамир Мугу - Черные глаза (DnB)", genre: "Drum & Bass", duration: "5:56" },
      { id: "7846806", title: "Кино - Группа крови (DnB Cover)", genre: "Drum & Bass", duration: "3:52" },
      { id: "7839561", title: "Mr. President - Coco Jambo (Trance)", genre: "Progressive Trance", duration: "5:20" },
      { id: "7810921", title: "Кино - кукушка (Psytrance)", genre: "Trance", duration: "6:33" },
      { id: "7795500", title: "Юра Шатунов - Седая ночь (Prog)", genre: "Progressive House", duration: "2:53" },
      { id: "7674226", title: "OST Inception - Time (Prog Cover)", genre: "Progressive House", duration: "4:03" },
      { id: "7559495", title: "ТАТУ - Скажи зачем (Cover)", genre: "Deep House", duration: "3:09" },
      { id: "7455822", title: "Chris Isaak - Wicked Game (Prog)", genre: "Progressive House", duration: "4:26" },
      { id: "7411560", title: "Desireless - Voyage Voyage (Deep)", genre: "Deep House", duration: "5:03" },
      { id: "7381997", title: "Кино - Кукушка (Deep House)", genre: "Deep House", duration: "5:57" }
    ];

    const GENRE_COLORS = {
      "Deep House": "#00f2ff", "Progressive House": "#b829e3", "Progressive Trance": "#ff007f",
      "Trance": "#ff5e00", "Dubstep": "#39ff14", "Drum & Bass": "#ffe600", "Nu metal": "#ff003c",
      "Rock": "#ff3333", "Ambient": "#9d4edd", "Tech House": "#00ff9d", "Glitch Hop": "#00fff0",
      "Hip-hop/Rap": "#ff9e00", "Trap": "#ff00ff", "Slap House": "#00ccff", "Jazz": "#ffd700",
      "Big Room House": "#ff3399", "Pop": "#ff66b2", "Melodic Techno": "#3366ff", "Melodic Trance": "#c77dff",
      "Instrumental": "#a0a0a0", "Goa Trance": "#ff7b00", "Unknown": "#666666", "Electro House": "#00ff66"
    };

    function getGenreColor(genre) { return GENRE_COLORS[genre] || "#8a8a9e"; }

    let selectedGenre = 'ALL';
    const tracksContainer = document.getElementById('tracksContainer');
    const searchInput = document.getElementById('searchInput');
    const trackCountEl = document.getElementById('trackCount');
    const fixedPlayerBar = document.getElementById('fixedPlayerBar');

    document.querySelectorAll('.tag-btn').forEach(btn => {
      const match = btn.getAttribute('onclick').match(/'([^']+)'/);
      if (match) {
        const genre = match[1];
        const color = genre === 'ALL' ? '#ffffff' : (GENRE_COLORS[genre] || '#8a8a9e');
        btn.style.setProperty('--genre-color', color);
      }
    });

    function generateCover(trackId, title, genreColor) {
      const safeTitle = title.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
          <defs>
            <linearGradient id="bg${trackId}" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:${genreColor}; stop-opacity: 0.35"/>
              <stop offset="100%" style="stop-color:#0a0a0f; stop-opacity: 0.95"/>
            </linearGradient>
          </defs>
          <rect width="400" height="400" fill="url(#bg${trackId})"/>
          <rect x="12" y="12" width="376" height="376" rx="16" fill="none" stroke="${genreColor}" stroke-width="4" stroke-opacity="0.6"/>
          <text x="200" y="180" font-family="system-ui, sans-serif" font-size="26" font-weight="900" fill="${genreColor}" text-anchor="middle" letter-spacing="2">PLAY BACK</text>
          <text x="200" y="230" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">${safeTitle}</text>
        </svg>
      `;
      return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
    }

    function filterGenre(genre) {
      tg.HapticFeedback.impactOccurred('light');
      selectedGenre = genre;
      document.querySelectorAll('.tag-btn').forEach(btn => {
        const match = btn.getAttribute('onclick').match(/'([^']+)'/);
        const btnGenre = match ? match[1] : '';
        btn.classList.toggle('active', btnGenre === genre);
      });
      renderTracks();
    }

    function playPromoTrack(id, title, cardElement) {
      tg.HapticFeedback.impactOccurred('medium');
      
      document.querySelectorAll('.track-card').forEach(c => {
        c.classList.remove('is-playing');
        const iframe = c.querySelector('.inline-player-iframe');
        if (iframe) iframe.src = 'about:blank';
      });
      document.querySelectorAll('.playing-badge').forEach(b => b.style.display = 'none');

      cardElement.classList.add('is-playing');
      const badge = cardElement.querySelector('.playing-badge');
      if (badge) badge.style.display = 'flex';
      
      const inlineIframe = cardElement.querySelector('.inline-player-iframe');
      if (inlineIframe) {
        inlineIframe.src = `https://promodj.com/embed/${id}/big`;
      }

      document.getElementById('playerTitle').textContent = title;
      document.getElementById('promodjFrame').src = `https://promodj.com/embed/${id}/big`;
      fixedPlayerBar.classList.add('is-active');
      
      tg.MainButton.setText(`Открыть на PromoDJ`);
      tg.MainButton.setColor('#b829e3');
      tg.MainButton.setTextColor('#ffffff');
      tg.MainButton.show();
      
      // Пересчитываем отступы, так как MainButton изменил safeAreaInset.bottom
      updateLayout();
      
      tg.MainButton.onClick(() => {
        tg.HapticFeedback.impactOccurred('light');
        tg.openLink(`https://promodj.com/pickled.brain/sets/${id}`);
      });
      
      // Скролл к карточке с учетом того, что она раскрылась
      setTimeout(() => {
        cardElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 200);
    }

    function renderTracks() {
      const query = searchInput.value.toLowerCase();
      tracksContainer.innerHTML = '';

      const filtered = TRACKS_DATA.filter(t => {
        const matchesGenre = selectedGenre === 'ALL' || t.genre.toLowerCase().includes(selectedGenre.toLowerCase());
        const matchesSearch = t.title.toLowerCase().includes(query) || t.genre.toLowerCase().includes(query);
        return matchesGenre && matchesSearch;
      });

      trackCountEl.textContent = filtered.length;

      filtered.forEach((track, index) => {
        const card = document.createElement('div');
        card.className = 'track-card';
        
        const genreColor = getGenreColor(track.genre);
        card.style.setProperty('--genre-color', genreColor);
        const coverUrl = generateCover(track.id, track.title, genreColor);
        
        card.innerHTML = `
          <div class="card-cover-wrap">
            <img src="${coverUrl}" class="card-cover" alt="Cover" loading="lazy">
            <div class="play-btn-overlay">
              <div class="play-circle" style="background: ${genreColor}; box-shadow: 0 0 12px ${genreColor}80;">
                <svg width="18" height="18" fill="#fff" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              </div>
            </div>
            <div class="playing-badge" style="display: none; background: ${genreColor};">
              <span>PLAY</span>
              <div class="equalizer">
                <span></span><span></span><span></span>
              </div>
            </div>
          </div>
          <div class="card-content">
            <div class="track-title">${track.title}</div>
            <div class="track-meta">
              <span class="track-genre" style="color: ${genreColor};">${track.genre}</span>
              <span>${track.duration}</span>
            </div>
          </div>
          <div class="inline-player-wrapper">
            <div class="inline-player-title" style="color: ${genreColor}">${track.title}</div>
            <iframe class="inline-player-iframe" src="about:blank" allow="autoplay" loading="lazy"></iframe>
          </div>
        `;
        
        card.style.animation = `fadeInUp 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards`;
        card.style.animationDelay = `${Math.min(index * 0.03, 0.4)}s`;
        
        card.onclick = () => playPromoTrack(track.id, track.title, card);
        tracksContainer.appendChild(card);
      });
    }

    function openProfile(e) {
      e.preventDefault();
      tg.HapticFeedback.impactOccurred('light');
      tg.openLink('https://promodj.com/pickled.brain');
    }

    function openPodcast() {
      tg.HapticFeedback.impactOccurred('light');
      tg.openLink('https://promodj.com/pickled.brain/podcast.xml');
    }

    searchInput.addEventListener('input', renderTracks);
    tg.MainButton.hide();
    renderTracks();
  </script>
</body>
</html>
